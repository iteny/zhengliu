<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>河马工具箱</title>
<style>
  /* ===================== 变量 ===================== */
  :root{
    --blue:#0071E3;
    --ink:#14161C;
    --ink-2:#4C525E;
    --ink-3:#6B7280;
    --line:rgba(20,30,60,.10);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(1000px 700px at 50% -10%, #FFFFFF 0%, #EDEFF7 42%, #DDE1EE 100%);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ===================== 机身 ===================== */
  .device{
    position:relative;
    width:390px;
    height:844px;
    height:min(844px, calc(100vh - 48px));   /* 窗口太矮时自动缩短，保证完整可见 */
    min-height:560px;
    border-radius:54px;
    background:#F4F6FC;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.10),
      0 0 0 11px #FCFCFE,
      0 0 0 12px #E1E4EC,
      0 0 0 13px #F3F4F8,
      0 34px 80px -28px rgba(40,50,90,.35),
      0 10px 26px -18px rgba(40,50,90,.22);
  }

  /* ===================== 流动彩色背景 ===================== */
  .bg{
    position:absolute; inset:0; z-index:0; overflow:hidden;
    background:linear-gradient(165deg,#F8FBFF 0%,#FDF5FB 44%,#F2FBFA 100%);
  }
  .bg i{
    position:absolute; display:block; border-radius:50%;
    filter:blur(44px); opacity:.9;
    will-change:transform;
  }
  .b1{ width:300px;height:300px; left:-70px;  top:-60px;   background:radial-gradient(circle at 35% 35%,#A6C6FF,rgba(166,198,255,0)); animation:float1 18s ease-in-out infinite; }
  .b2{ width:290px;height:290px; right:-90px; top:40px;    background:radial-gradient(circle at 50% 50%,#D8B6FF,rgba(216,182,255,0)); animation:float2 22s ease-in-out infinite; }
  .b3{ width:330px;height:330px; left:-110px; bottom:110px;background:radial-gradient(circle at 50% 50%,#FFBDDB,rgba(255,189,219,0)); animation:float3 20s ease-in-out infinite; }
  .b4{ width:270px;height:270px; right:-70px; bottom:-50px;background:radial-gradient(circle at 50% 50%,#A4EEE3,rgba(164,238,227,0)); animation:float1 25s ease-in-out infinite reverse; }
  .b5{ width:230px;height:230px; left:80px;   top:290px;   background:radial-gradient(circle at 50% 50%,#FFE0A6,rgba(255,224,166,0)); animation:float2 27s ease-in-out infinite; }
  @keyframes float1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(34px,42px) scale(1.12); }
  }
  @keyframes float2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%    { transform:translate(-42px,28px) scale(1.08); }
  }
  @keyframes float3{
    0%,100%{ transform:translate(0,0) scale(1.06); }
    50%    { transform:translate(28px,-36px) scale(.98); }
  }

  /* ===================== 液态玻璃基类 ===================== */
  .glass{
    position:relative;
    background:linear-gradient(150deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.30) 52%, rgba(255,255,255,.46) 100%);
    backdrop-filter:blur(26px) saturate(190%) brightness(1.06);
    -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.06);
    border:1px solid rgba(255,255,255,.68);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.98),
      inset 0 -1.5px 0 rgba(255,255,255,.50),
      inset 1.5px 0 0 rgba(255,255,255,.45),
      inset -1.5px 0 0 rgba(255,255,255,.45),
      0 10px 30px -10px rgba(50,60,110,.20),
      0 2px 6px -3px rgba(50,60,110,.12);
  }
  /* 色散描边（液玻的彩虹边缘） */
  .glass::before{
    content:""; position:absolute; inset:-1px; border-radius:inherit;
    padding:1px; pointer-events:none;
    background:conic-gradient(from 150deg at 50% 50%,
      rgba(255,255,255,.95),
      rgba(175,215,255,.55),
      rgba(255,190,240,.50),
      rgba(190,255,238,.55),
      rgba(255,255,255,.95));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
    opacity:.85;
  }
  /* 液态流光 */
  .glass::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    pointer-events:none; z-index:0;
    background:linear-gradient(118deg,
      transparent 24%,
      rgba(255,255,255,.55) 42%,
      rgba(255,255,255,.12) 50%,
      transparent 68%);
    background-size:240% 240%;
    animation:liquid 9s ease-in-out infinite;
    opacity:.75;
  }
  @keyframes liquid{
    0%,100%{ background-position:0% 50%; }
    50%    { background-position:100% 50%; }
  }
  .glass > *{ position:relative; z-index:1; }

  /* ===================== 状态栏 ===================== */
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:46px; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px; font-size:14.5px; font-weight:600; letter-spacing:-.1px;
    color:var(--ink);
  }
  .statusbar .icons{ display:flex; align-items:center; gap:5px; }
  .statusbar svg{ display:block; }

  /* 顶部柔化遮罩，保证状态栏可读 */
  .topfade{
    position:absolute; top:0; left:0; right:0; height:70px; z-index:7;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.28) 54%, transparent 100%);
  }

  /* ===================== 滚动内容 ===================== */
  .pages{
    position:absolute; inset:0; z-index:1;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:0 0 128px;
  }
  .pages::-webkit-scrollbar{ width:0; }

  .page{ display:none; padding-top:116px; }
  .page.active{ display:block; animation:pageIn .46s cubic-bezier(.32,.72,0,1) both; }
  @keyframes pageIn{
    from{ opacity:0; transform:translateY(12px) scale(.992); }
    to  { opacity:1; transform:none; }
  }

  /* ===================== 玻璃卡片 ===================== */
  .body{ padding:0 14px 28px; }

  /* ===================== 工具宫格 ===================== */
  .panel{ border-radius:26px; padding:15px 6px 20px; }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 14px 14px;
  }
  .panel-title{ font-size:15px; font-weight:650; letter-spacing:-.3px; color:var(--ink); }
  .panel-sub{ font-size:12px; color:var(--ink-3); }

  .tools{
    display:grid; grid-template-columns:repeat(4,1fr);
    row-gap:20px; column-gap:3px;
  }
  .tool{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    border:0; background:none; padding:0; cursor:pointer; font-family:inherit;
  }
  .tool-ic{
    width:52px; height:52px; border-radius:17px;
    display:grid; place-items:center;
    background:
      radial-gradient(circle at 30% 22%, rgba(var(--c),.26), transparent 68%),
      linear-gradient(155deg, rgba(255,255,255,.88), rgba(255,255,255,.48));
    border:1px solid rgba(255,255,255,.92);
    box-shadow:
      inset 0 1.2px 0 #FFFFFF,
      inset 0 -1px 0 rgba(255,255,255,.62),
      0 6px 14px -8px rgba(50,60,110,.42);
    backdrop-filter:blur(12px) saturate(170%);
    -webkit-backdrop-filter:blur(12px) saturate(170%);
    transition:transform .18s cubic-bezier(.32,.72,0,1);
  }
  .tool-ic svg{
    width:25px; height:25px;
    fill:none; stroke:rgb(var(--c)); stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .tool-name{
    font-size:10.5px; font-weight:500; letter-spacing:-.2px;
    color:var(--ink-2); text-align:center;
    line-height:1.24; max-width:100%; padding:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .tool:active .tool-ic{ transform:scale(.9); }

  /* 卡片堆叠间距 */
  .body > .panel + .panel{ margin-top:14px; }

  /* ===================== 分类页：左导航 + 右内容 ===================== */
  .cat-wrap{ display:flex; gap:10px; align-items:flex-start; }

  .catnav{
    width:96px; flex:0 0 96px;
    border-radius:22px; padding:8px 6px;
    display:flex; flex-direction:column; gap:2px;
    position:sticky; top:110px;
    max-height:calc(100vh - 250px);
    overflow-y:auto; overscroll-behavior:contain;
  }
  .catnav::-webkit-scrollbar{ width:0; }
  .catnav::after{ display:none; }

  .cnav{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border:0; background:none; cursor:pointer;
    border-radius:16px; font-family:inherit;
    font-size:11.5px; font-weight:500; letter-spacing:-.1px;
    color:var(--ink-2);
    transition:background .2s ease, color .2s ease, box-shadow .2s ease, transform .16s ease;
  }
  .cnav svg{
    width:21px; height:21px;
    fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round;
    transition:transform .24s cubic-bezier(.32,.72,0,1);
  }
  .cnav.active{
    color:rgb(var(--c));
    background:linear-gradient(155deg, rgba(255,255,255,.96), rgba(255,255,255,.64));
    box-shadow:
      inset 0 1px 0 #FFFFFF,
      inset 0 -1px 0 rgba(255,255,255,.6),
      0 3px 9px -5px rgba(50,60,110,.45);
  }
  .cnav.active svg{ transform:scale(1.06); }
  .cnav:active{ transform:scale(.95); }

  .catpanel{
    flex:1 1 auto; min-width:0;
    border-radius:22px; padding:14px 8px 12px;
  }
  .catpanel::after{ display:none; }

  .catrow{
    width:100%; display:flex; align-items:center; gap:10px;
    padding:9px 9px; border:0; background:none; cursor:pointer;
    font-family:inherit; font-size:13px; letter-spacing:-.1px;
    color:var(--ink); border-radius:14px; text-align:left;
    transition:background .18s ease;
  }
  .catrow:hover{ background:rgba(255,255,255,.5); }
  .catrow:active{ background:rgba(255,255,255,.8); }

  .rowico{
    width:34px; height:34px; flex:0 0 34px; border-radius:11px;
    display:grid; place-items:center;
    background:linear-gradient(155deg, rgba(255,255,255,.94), rgba(255,255,255,.56));
    border:1px solid rgba(255,255,255,.92);
    box-shadow:
      inset 0 1px 0 #FFFFFF,
      inset 0 -1px 0 rgba(255,255,255,.6),
      0 2px 6px -4px rgba(50,60,110,.45);
  }
  .rowico svg{
    width:19px; height:19px;
    fill:none; stroke:rgb(var(--c)); stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .catrow .nm{
    flex:1 1 auto; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .catrow .chev{
    width:13px; height:13px; flex:0 0 13px;
    fill:none; stroke:#BFC4D0; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;
  }

  /* ===================== 工具详情页 ===================== */
  .detail{
    position:absolute; inset:0; z-index:20;
    transform:translateX(100%);
    transition:transform .42s cubic-bezier(.32,.72,0,1);
    pointer-events:none;
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
  }
  .detail.open{
    transform:none; pointer-events:auto;
    box-shadow:-16px 0 44px -22px rgba(30,40,80,.38);
  }

  .d-topbar{
    position:absolute; top:48px; left:12px; right:12px; height:54px; z-index:2;
    display:flex; align-items:center; gap:8px;
    padding:0 10px; border-radius:20px;
  }
  .d-back{
    width:34px; height:34px; flex:0 0 34px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer;
    border:1px solid rgba(255,255,255,.9);
    background:rgba(255,255,255,.62);
    box-shadow:
      inset 0 1px 0 #FFFFFF,
      0 2px 6px -3px rgba(50,60,110,.4);
    color:var(--blue);
    transition:transform .16s ease;
  }
  .d-back svg{
    width:18px; height:18px;
    fill:none; stroke:currentColor; stroke-width:2.2;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .d-back:active{ transform:scale(.92); }
  .d-gap{ width:34px; flex:0 0 34px; }

  .d-title{
    flex:1 1 auto; min-width:0; text-align:center;
    font-size:16px; font-weight:650; letter-spacing:-.3px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .d-body{
    position:absolute; inset:0;
    padding:118px 14px 40px;
    overflow-y:auto;
  }
  .d-body::-webkit-scrollbar{ width:0; }

  .d-card{
    border-radius:26px; padding:46px 22px;
    text-align:center;
  }
  .d-ico{
    width:66px; height:66px; margin:0 auto 18px; border-radius:21px;
    display:grid; place-items:center;
    background:
      radial-gradient(circle at 30% 22%, rgba(var(--c),.28), transparent 68%),
      linear-gradient(155deg, rgba(255,255,255,.96), rgba(255,255,255,.56));
    border:1px solid rgba(255,255,255,.94);
    box-shadow:
      inset 0 1.4px 0 #FFFFFF,
      inset 0 -1px 0 rgba(255,255,255,.6),
      0 10px 22px -12px rgba(50,60,110,.5);
  }
  .d-ico svg{
    width:31px; height:31px;
    fill:none; stroke:rgb(var(--c)); stroke-width:1.55;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .d-name{
    font-size:17px; font-weight:650; letter-spacing:-.3px; color:var(--ink);
  }
  .d-desc{
    margin-top:8px; font-size:13px; line-height:1.65; color:var(--ink-3);
  }

  /* 悬浮收藏按钮 */
  .favbtn{
    position:absolute; right:18px; bottom:30px; z-index:3;
    width:54px; height:54px; border-radius:50%;
    display:grid; place-items:center; padding:0; cursor:pointer;
    border:1px solid rgba(255,255,255,.92);
    background:linear-gradient(155deg, rgba(255,255,255,.94), rgba(255,255,255,.58));
    box-shadow:
      inset 0 1.4px 0 #FFFFFF,
      inset 0 -1px 0 rgba(255,255,255,.62),
      0 10px 24px -12px rgba(50,60,110,.55);
    backdrop-filter:blur(16px) saturate(170%);
    -webkit-backdrop-filter:blur(16px) saturate(170%);
    color:#7C8496;
    transition:color .2s ease, box-shadow .26s ease, transform .18s cubic-bezier(.32,.72,0,1);
  }
  .favbtn svg{
    width:24px; height:24px;
    fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round;
    transition:fill .2s ease, stroke .2s ease;
  }
  .favbtn:active{ transform:scale(.9); }

  .favbtn.on{
    color:rgb(var(--c));
    box-shadow:
      inset 0 1.4px 0 #FFFFFF,
      inset 0 -1px 0 rgba(255,255,255,.62),
      0 10px 24px -12px rgba(50,60,110,.5),
      0 0 0 3px rgba(var(--c),.16);
  }
  .favbtn.on svg{
    fill:rgb(var(--c));
    fill-opacity:.92;
  }
  .favbtn.pop{ animation:pop .4s cubic-bezier(.32,.72,0,1); }
  @keyframes pop{
    0%  { transform:scale(.84); }
    55% { transform:scale(1.12); }
    100%{ transform:scale(1); }
  }

  /* ===================== 登录弹层 ===================== */
  .sheet-mask{
    position:absolute; inset:0; z-index:22;
    background:rgba(30,36,60,.22);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
  }
  .sheet-mask.open{ opacity:1; pointer-events:auto; }

  .loginsheet{
    position:absolute; left:0; right:0; bottom:0; z-index:23;
    padding:10px 20px 40px;
    border-radius:30px 30px 0 0;
    background:rgba(255,253,249,.95);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.92);
    box-shadow:0 -22px 54px -30px rgba(30,40,80,.5);
    transform:translateY(103%);
    transition:transform .44s cubic-bezier(.32,.72,0,1);
  }
  .loginsheet.open{ transform:none; }

  .ls-handle{
    width:38px; height:4.5px; border-radius:3px;
    background:rgba(70,80,110,.20);
    margin:0 auto 18px;
  }
  .ls-head{ display:flex; align-items:center; justify-content:space-between; }
  .ls-title{ font-size:20px; font-weight:700; letter-spacing:-.4px; color:var(--ink); }
  .ls-close{
    width:30px; height:30px; border-radius:50%; padding:0; border:0; cursor:pointer;
    background:rgba(120,132,155,.14);
    display:grid; place-items:center;
    transition:background .2s ease;
  }
  .ls-close:hover{ background:rgba(120,132,155,.22); }
  .ls-close svg{
    width:11px; height:11px;
    stroke:rgba(70,80,110,.75); stroke-width:2.6;
    fill:none; stroke-linecap:round;
  }
  .ls-sub{ margin:6px 0 20px; font-size:13px; color:var(--ink-3); letter-spacing:-.1px; }

  /* 微信登录按钮 */
  .wx-btn{
    width:100%; height:52px; border:0; border-radius:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-family:inherit; font-size:16px; font-weight:650; letter-spacing:-.2px;
    color:#FFFFFF; background:#07C160;
    box-shadow:
      0 10px 22px -12px rgba(7,193,96,.8),
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(0,90,45,.25);
    transition:transform .16s ease, filter .2s ease;
  }
  .wx-btn svg{ width:24px; height:24px; display:block; }
  .wx-btn:active{ transform:scale(.985); filter:brightness(.93); }
  .wx-btn[data-busy]{ opacity:.75; pointer-events:none; }

  .ls-tip{
    margin:14px 0 0; text-align:center;
    font-size:11px; letter-spacing:-.1px; color:#A9B0BE;
  }

  /* 联系我们 */
  .ls-sep{
    height:1px; margin:22px 0 14px;
    background:linear-gradient(90deg,transparent,rgba(150,165,190,.42),transparent);
  }
  /* 客服二维码 */
  .qr-wrap{ margin-top:18px; text-align:center; }
  .qr-box{
    width:116px; height:116px; margin:0 auto;
    padding:8px; border-radius:14px;
    background:#FFFFFF;
    box-shadow:
      0 6px 16px -10px rgba(30,40,80,.45),
      inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .qr-box svg{ width:100%; height:100%; display:block; fill:#14161C; }
  .qr-tip{
    margin:10px 0 0; font-size:11.5px; letter-spacing:-.1px; color:var(--ink-3);
  }

  /* 登录后的头像态 */
  .login.account{
    width:30px; height:30px; padding:0; border-radius:50%;
    display:grid; place-items:center;
    background:linear-gradient(160deg,#2E9BFF 0%,#0071E3 100%);
  }
  .login.account svg{
    width:19px; height:19px;
    fill:none; stroke:#FFFFFF; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;
  }

  /* 用户菜单 */
  .userpop{
    position:absolute; top:104px; right:14px; z-index:24;
    width:184px; padding:6px;
    border-radius:16px;
    background:rgba(255,253,249,.97);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 16px 38px -20px rgba(30,40,80,.45);
    opacity:0; transform:translateY(-6px) scale(.96);
    transform-origin:top right;
    pointer-events:none;
    transition:opacity .2s ease, transform .24s cubic-bezier(.32,.72,0,1);
  }
  .userpop.open{ opacity:1; transform:none; pointer-events:auto; }

  .up-name{
    padding:10px 12px 9px; margin-bottom:4px;
    font-size:12px; letter-spacing:-.1px; color:var(--ink-3);
    border-bottom:1px solid rgba(180,195,220,.35);
  }
  .up-logout{
    width:100%; height:38px; padding:0 12px;
    border:0; border-radius:11px; cursor:pointer;
    background:none; text-align:left;
    font-family:inherit; font-size:14px; letter-spacing:-.2px; color:#D9433F;
    transition:background .18s ease;
  }
  .up-logout:hover{ background:rgba(217,67,63,.08); }

  /* ===================== 收藏页空态 ===================== */
  .fav-empty{ padding:52px 20px 56px; text-align:center; }
  .fav-empty svg{
    width:30px; height:30px; margin:0 auto 14px; display:block;
    fill:none; stroke:#C3C8D4; stroke-width:1.4;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .fav-empty .t{ font-size:14px; font-weight:600; letter-spacing:-.2px; color:var(--ink); }

  const tabs     = [...document.querySelectorAll('.tab')];
  const pages    = [...document.querySelectorAll('.page')];

  function switchTo(target){
    const tab = tabs.find(t => t.dataset.target === target);
    if (!tab) return;
    document.getElementById('detail').classList.remove('open');
    document.getElementById('searchPanel').classList.remove('open');
    tabs.forEach(t => t.classList.toggle('active', t === tab));
    pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + target));
    scroller.scrollTop = 0;
    if (target === 'fav') renderFav();

      if (tab.classList.contains('active')) return;

  function renderFav(){
    const items = [...favSet]
      .map(n => SEARCH_INDEX.find(x => x.name === n))
      .filter(Boolean);

    favCount.textContent = items.length;
    favEmpty.style.display = items.length ? 'none' : 'block';
    favGrid.innerHTML = items.map(x => `
      <button class="tool" style="--c:${x.color}" data-n="${x.name}">
        <span class="tool-ic">${x.svg}</span>
        <span class="tool-name">${x.name}</span>
      </button>`).join('');
  }

  favGrid.addEventListener('click', e => {
    const btn = e.target.closest('.tool');
    if (!btn) return;
    const item = SEARCH_INDEX.find(x => x.name === btn.dataset.n);
    if (!item) return;
    openTool(item.name, item.svg, item.color);
  });

  renderFav();

  /* ---------- 登录 ---------- */
  const loginBtn   = document.getElementById('loginBtn');
  const loginMask  = document.getElementById('loginMask');
  const loginSheet = document.getElementById('loginSheet');
  const lsClose    = document.getElementById('lsClose');
  const wxLogin    = document.getElementById('wxLogin');
  const wxLabel    = document.getElementById('wxLabel');
  const userPop    = document.getElementById('userPop');
  const upName     = document.getElementById('upName');
  const upLogout   = document.getElementById('upLogout');

  const AVATAR_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="3.5"/><path d="M4.9 20c.9-3.7 3.6-5.8 7.1-5.8s6.2 2.1 7.1 5.8"/></svg>';

  let currentUser = null;

  function applyUser(user){
    currentUser = user;
    if (user){
      loginBtn.classList.add('account');
      loginBtn.innerHTML = AVATAR_SVG;
      upName.textContent = user.name;
    } else {
      loginBtn.classList.remove('account');
      loginBtn.textContent = '登录';
      userPop.classList.remove('open');
    }
    try{
      localStorage.setItem('hb_user', user ? JSON.stringify(user) : '');
    }catch(e){}
  }

  function openLogin(){
    loginMask.classList.add('open');
    loginSheet.classList.add('open');
  }
  function closeLogin(){
    loginMask.classList.remove('open');
    loginSheet.classList.remove('open');
  }

  loginBtn.addEventListener('click', () => {
    if (currentUser) userPop.classList.toggle('open');
    else openLogin();
  });

  lsClose.addEventListener('click', closeLogin);
  loginMask.addEventListener('click', closeLogin);

  /* 微信一键登录（演示：模拟授权结果） */
  wxLogin.addEventListener('click', () => {
    if (wxLogin.hasAttribute('data-busy')) return;
    wxLogin.setAttribute('data-busy', '');
    wxLabel.textContent = '正在登录…';

    setTimeout(() => {
      applyUser({ name: '河马同学' });
      closeLogin();
      wxLabel.textContent = '微信一键登录';
      wxLogin.removeAttribute('data-busy');
    }, 750);
  });

  upLogout.addEventListener('click', () => {
    applyUser(null);
    userPop.classList.remove('open');
  });

  document.addEventListener('click', e => {
    if (!userPop.classList.contains('open')) return;
    if (e.target.closest('#userPop') || e.target.closest('#loginBtn')) return;
    userPop.classList.remove('open');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ closeLogin(); userPop.classList.remove('open'); }
  });

  /* 客服二维码（装饰性图案，非真实可扫码） */
  function drawQR(el, n = 25){
    let seed = 20261023;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const inFinder = (x, y) =>
      (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);

    let cells = '';
    for (let y = 0; y < n; y++){
      for (let x = 0; x < n; x++){
        if (inFinder(x, y)) continue;
        if (rnd() > 0.5) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
      }
    }

    const finder = (ox, oy) =>
      `<path fill-rule="evenodd" d="M${ox} ${oy}h7v7h-7z M${ox + 1} ${oy + 1}h5v5h-5z"/>` +
      `<rect x="${ox + 2}" y="${oy + 2}" width="3" height="3"/>`;

    el.innerHTML =
      `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">` +
        cells + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) +
      `</svg>`;
  }

  drawQR(document.getElementById('qrBox'));

  /* 恢复登录态 */
  try{
    const saved = localStorage.getItem('hb_user');
    if (saved) applyUser(JSON.parse(saved));
  }catch(e){}
  /* ---------- 首页 / 独家页工具按钮 → 详情页 ---------- */
  document.querySelectorAll('.tool').forEach(btn => {
    if (btn.dataset.cat) return;            // 分类入口 → 走跳转逻辑
    btn.addEventListener('click', () => {
      const name  = btn.dataset.n || btn.querySelector('.tool-name').textContent.trim();
      const svg   = btn.querySelector('.tool-ic svg');
      const color = (btn.style.getPropertyValue('--c') || '59,125,216').trim();
      if (!svg) return;
      openTool(name, svg.outerHTML, color);
    });
  });
</script>
</body>
</html>
